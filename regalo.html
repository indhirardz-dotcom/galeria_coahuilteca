<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Gift from Galería Coahuilteca · Sororidad</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f5f1;color:#171717;font-family:Arial,Helvetica,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:48px 28px 70px;text-align:center}
  .kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:14px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,6vw,72px);font-weight:400;margin:0 0 10px}
  .intro{max-width:620px;margin:0 auto 34px;color:#666;line-height:1.6}
  .art{background:#fff;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.08);display:inline-block;max-width:100%}
  .art img{display:block;max-width:100%;height:auto}
  .actions{margin-top:28px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
  a{display:inline-block;padding:13px 20px;border:1px solid #171717;text-decoration:none;color:#171717;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  a.primary{background:#171717;color:#fff}
  .note{font-size:11px;color:#777;margin-top:18px}
  @media print{
    body{background:#fff}
    .wrap{padding:0}
    .kicker,.intro,.actions,.note{display:none}
    .art{box-shadow:none;padding:0;max-width:100%}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">Galería Coahuilteca · A gift from the gallery</div>
  <h1>Sororidad</h1>
  <p class="intro">Thank you for staying close to the art. This printable artwork by Indhira is our gift to you.</p>
  <div class="art">
    <img src="sororidad.jpg" alt="Sororidad by Indhira">
  </div>
  <div class="actions">
    <a class="primary" href="sororidad.jpg" download="Indhira-Sororidad.jpg">Download artwork</a>
    <a href="#" onclick="window.print();return false;">Print / Save as PDF</a>
  </div>
  <div class="note">For personal use · Galería Coahuilteca · San Miguel de Allende</div>
</main>
</body>
</html>
