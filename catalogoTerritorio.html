
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Territorio de Batalla | Catálogo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
overflow:hidden;
font-family:Georgia,"Times New Roman",serif;
}

body{

background:url("invitacion.jpg") center center no-repeat;

background-size:cover;

position:relative;

}

/* oscurece ligeramente la imagen */

body::after{

content:"";

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.18);

}

/* botones */

.botones{

position:absolute;

left:50%;
bottom:45px;

transform:translateX(-50%);

display:flex;

gap:18px;

z-index:10;

flex-wrap:wrap;

justify-content:center;

}

/* estilo */

.boton{

background:rgba(255,255,255,.92);

color:#111;

padding:16px 34px;

text-decoration:none;

font-size:18px;

letter-spacing:.5px;

border-radius:40px;

transition:.25s;

box-shadow:0 8px 25px rgba(0,0,0,.35);

font-weight:bold;

}

.boton:hover{

background:white;

transform:translateY(-2px);

box-shadow:0 14px 35px rgba(0,0,0,.45);

}

/* celular */

@media(max-width:700px){

.botones{

flex-direction:column;

width:90%;

}

.boton{

text-align:center;

}

}

</style>

</head>

<body>

<div class="botones">

<a class="boton"
href="catalogoTerritorio.pdf"
target="_blank">

📖 Ver catálogo

</a>

<a class="boton"
href="catalogoTerritorio.pdf"
download>

⬇ Descargar PDF

</a>

</div>

</body>

</html>
