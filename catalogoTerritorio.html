
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Territorio de Batalla | Catálogo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;

}

body{

font-family:Georgia,"Times New Roman",serif;

background:#f5f1eb;

background-image:url("invitacion.jpg");

background-repeat:no-repeat;

background-position:center center;

background-size:contain;

display:flex;

justify-content:center;

align-items:flex-end;

}

/* Botones */

.botones{

width:100%;

display:flex;

justify-content:center;

gap:20px;

padding-bottom:35px;

flex-wrap:wrap;

}

/* Estilo botones */

.boton{

background:rgba(255,255,255,.96);

padding:18px 38px;

border-radius:40px;

text-decoration:none;

font-size:22px;

font-weight:bold;

color:#111;

box-shadow:0 8px 25px rgba(0,0,0,.25);

transition:.25s;

}

.boton:hover{

background:white;

transform:translateY(-2px);

}

/* Celular */

@media(max-width:800px){

body{

background-size:contain;

background-position:center top;

}

.botones{

padding-bottom:18px;

}

.boton{

font-size:18px;

padding:16px 24px;

}

}

</style>

</head>

<body>

<div class="botones">

<a class="boton"
href="catalogoTerritorio.pdf"
target="_blank">

📖 Ver catálogo

</a>

<a class="boton"
href="catalogoTerritorio.pdf"
download>

⬇ Descargar PDF

</a>

</div>

</body>

</html>
