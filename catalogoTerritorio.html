
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Territorio de Batalla | Catálogo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;

}

body{

background:#f5f1eb;

background-image:url("invitacion.jpg");

background-repeat:no-repeat;

background-position:center top;

background-size:contain;

font-family:Georgia,"Times New Roman",serif;

position:relative;

overflow:hidden;

}


/* BOTONES */

.botones{

position:absolute;

left:50%;

bottom:165px;

transform:translateX(-50%);

width:900px;

max-width:92%;

display:flex;

justify-content:space-between;

align-items:center;

z-index:100;

pointer-events:none;

}


/* ESTILO BOTONES */

.boton{

pointer-events:auto;

display:inline-block;

padding:18px 38px;

border-radius:60px;

text-decoration:none;

font-size:22px;

font-weight:bold;

color:white;

background:rgba(255,255,255,.12);

backdrop-filter:blur(14px);

-webkit-backdrop-filter:blur(14px);

border:1px solid rgba(255,255,255,.35);

box-shadow:0 10px 35px rgba(0,0,0,.30);

transition:.25s;

}


.boton:hover{

background:rgba(255,255,255,.22);

transform:translateY(-2px);

}


/* CELULAR */

@media(max-width:900px){

body{

background-size:contain;

background-position:center top;

overflow:auto;

}

.botones{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

width:95%;

display:flex;

flex-direction:column;

gap:12px;

}

.boton{

width:100%;

text-align:center;

font-size:18px;

padding:16px;

}

}

</style>

</head>

<body>

<div class="botones">

<a class="boton"

href="catalogoTerritorio.pdf"

target="_blank">

📖 Ver catálogo

</a>

<a class="boton"

href="catalogoTerritorio.pdf"

download>

⬇ Descargar PDF

</a>

</div>

</body>

</html>
